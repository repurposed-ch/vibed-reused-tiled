<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .frame { stroke: #2e2822; }
    @media (prefers-color-scheme: dark) { .frame { stroke: #f3ebe1; } }
  </style>
  <!-- Five square reused tiles wrapping the field, dark to light along the L, at a pitch of 16; the frame lines up with them. -->
  <rect x="9" y="9" width="14" height="14" rx="1.5" fill="#7a3418" />
  <rect x="9" y="25" width="14" height="14" rx="1.5" fill="#a84e26" />
  <rect x="9" y="41" width="14" height="14" rx="1.5" fill="#d9773a" />
  <rect x="25" y="41" width="14" height="14" rx="1.5" fill="#e49b62" />
  <rect x="41" y="41" width="14" height="14" rx="1.5" fill="#eebf8e" />
  <rect class="frame" x="26" y="10" width="28" height="28" fill="none" stroke-width="2" />
</svg>
